<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Index</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 10px;
            font-size: 24px;
        }
        .file-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 6px;
        }
        .file-item {
            border-bottom: 1px solid #eaeaea;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        .file-link {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            text-decoration: none;
            color: #0066cc;
        }
        .file-link:hover {
            background-color: #f5f5f5;
            color: #004499;
        }
        .file-meta {
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <h1>Index of Files</h1>

    <ul class="file-list">
        <!-- Template Row 1 -->
 <li class="file-item">
            <a href="/Extra-Stuff/my-windows7-simulator" class="file-link">
                <span class="file-name">🌐 Windows 7 Simulator</span>
                <span class="file-meta">Folder</span>
        <!-- Template Row 2 -->
        <li class="file-item">
            <a href="/Extra-Stuff/jobteens" class="file-link">
                <span class="file-name">🌐 Jobteens</span>
                <span class="file-meta">Folder</span>
            </a>
        </li>
        <!-- Add more rows below by copying a <li> block -->
    </ul>

</body>
</html>
